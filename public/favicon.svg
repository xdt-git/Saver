<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="NightReel">
    <defs>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect x="6" y="6" width="84" height="84" rx="18" fill="#08080c" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
    <text x="48" y="61" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1" fill="#ffffff" filter="url(#glow)">NR</text>
</svg>
