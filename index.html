<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="NightReel — save and track the movies, series, anime, cartoons and games you love."
        />
        <title>NightReel</title>
        <script>
            // Applies the saved theme before the first paint so the page never flashes.
            // Mirrors src/shared/config/theme/theme.ts (THEME_STORAGE_KEY, DEFAULT_THEME_MODE).
            (function () {
                var mode = "dark";
                try {
                    var stored = localStorage.getItem("saver.theme");
                    if (stored === "system" || stored === "light" || stored === "dark")
                        mode = stored;
                } catch (e) {}
                if (mode === "system") {
                    mode = window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                }
                document.documentElement.dataset.theme = mode;
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;1,300;1,500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
